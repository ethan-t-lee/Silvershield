<div class="email-view gmail-mobile-view">

    <div class="gmail-mobile-header">
        <button class="back-btn mobile-nav-btn" id="emailBackBtn" onclick="backToApps()"><span class="ui-icon arrow-left-icon" aria-hidden="true"></span><span class="btn-label">Back</span></button>

        <div class="gmail-mobile-brand">
            <span class="gmail-mobile-logo" aria-hidden="true"></span>
            <span class="gmail-mobile-wordmark">Gmail</span>
        </div>

        <div class="gmail-mobile-icons" aria-hidden="true">
            <span class="ui-icon search-icon"></span>
            <span class="ui-icon more-vert-icon"></span>
        </div>
    </div>

    <div class="gmail-mobile-search-pill" aria-hidden="true">Search in mail</div>

    <div class="gmail-mobile-card">
        <div class="gmail-mobile-card-header" aria-hidden="true">
            <span class="gmail-mobile-mailbox">Primary Inbox</span>
            <span class="gmail-mobile-unread">1 new</span>
        </div>

        <div id="emailBody" class="email-body gmail-mobile-body">
            Loading email...
        </div>
    </div>

    <div class="email-actions">
        <button id="readAloudMobile" class="tts-btn"><span class="btn-icon speaker-icon" aria-hidden="true"></span><span class="btn-label">Read Aloud</span></button>
        <button id="voiceAnswerBtn" class="tts-btn voice-answer-btn" title="Say &lsquo;real&rsquo; or &lsquo;fake&rsquo;"><span class="btn-icon mic-icon" aria-hidden="true"></span><span class="btn-label">Speak</span></button>
        <button id="markSafe" class="safe-btn"><span class="btn-label">Real</span></button>
        <button id="markScam" class="scam-btn"><span class="btn-label">Fake</span></button>
    </div>

</div>
