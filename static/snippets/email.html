<div class="email-view">

    <!-- Top Toolbar -->
    <div class="email-toolbar">
        <button class="back-btn" id="emailBackBtn" onclick="backToApps()">← Back</button>

        <div class="toolbar-icons">
            <span class="icon-btn">Mail</span>
            <span class="icon-btn">Trash</span>
            <span class="icon-btn">⋮</span>
        </div>
    </div>

    <!-- AI-generated email goes here -->
    <div id="emailBody" class="email-body">
        Loading email...
    </div>

    <!-- Read aloud above the choice buttons, using same style as choice buttons -->
    <!-- Read aloud + choice buttons -->
    <div class="email-actions">
        <button id="readAloudMobile" class="safe-btn">Read Aloud</button>
        <button id="voiceAnswerBtn" class="safe-btn voice-answer-btn" title="Say &lsquo;real&rsquo; or &lsquo;fake&rsquo;">Speak</button>
        <button id="markSafe" class="safe-btn">Real</button>
        <button id="markScam" class="scam-btn">Fake</button>
    </div>

</div>
