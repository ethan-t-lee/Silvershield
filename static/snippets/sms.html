<div class="sms-app">

    <div class ="top-bar">
        <button class="back-button" onclick = "backToApps()">← Back</button>
    </div>


      <!-- Flip phone top bar -->
    <div class="flip-status-bar">
                <span class="signal">SIG</span>
        <span class="carrier">Cingular</span>
                <span class="battery">BAT</span>
    </div>

       <!-- SMS thread -->
    <div class="flip-thread">
        <div class="flip-bubble incoming">
            <div id="smsBody">SMS content goes here...</div>
        </div>

        <div class="flip-meta" id="smsNumber">+1 000 000 0000</div>
        <div class="flip-time" id="smsTime">12:04 PM</div>
    </div>


    <div class="actions">
        <button id="readAloudMobile" class="tts-btn">Read Aloud</button>
        <button id="voiceAnswerBtn" class="tts-btn voice-answer-btn" title="Say &lsquo;real&rsquo; or &lsquo;fake&rsquo;">Speak</button>
        <button id="markSafe" class="safe-btn">Real</button>
        <button id="markScam" class="scam-btn">Fake</button>
    </div>

    <div id="feedback" class="feedback"></div>
</div>
