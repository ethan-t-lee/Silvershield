<div class="sms-app ios-messages-view">

    <div class="ios-messages-header">
        <button class="back-button ios-nav-back" onclick="backToApps()">← Back</button>

        <div class="ios-contact-center">
            <div id="smsAvatar" class="ios-contact-avatar">B</div>
            <div class="ios-contact-details">
                <div id="smsContactName" class="ios-contact-name">Bank Alerts</div>
                <div class="ios-contact-subtitle">Text Message</div>
            </div>
        </div>

        <div class="ios-info-icon" aria-hidden="true">ⓘ</div>
    </div>

    <div class="ios-message-thread flip-thread">
        <div class="ios-date-divider" id="smsTime">Today 12:04 PM</div>

        <div class="flip-bubble incoming imessage-bubble">
            <div id="smsBody">SMS content goes here...</div>
        </div>

        <div class="imessage-meta" id="smsNumber">+1 000 000 0000</div>
    </div>

    <div class="ios-compose-strip" aria-hidden="true">
        <span class="compose-pill">iMessage</span>
        <span class="compose-plus">＋</span>
    </div>

    <div class="actions">
        <button id="readAloudMobile" class="tts-btn">Read Aloud</button>
        <button id="voiceAnswerBtn" class="tts-btn voice-answer-btn" title="Say &lsquo;real&rsquo; or &lsquo;fake&rsquo;">Speak</button>
        <button id="markSafe" class="safe-btn">Real</button>
        <button id="markScam" class="scam-btn">Fake</button>
    </div>

    <div id="feedback" class="feedback"></div>
</div>
