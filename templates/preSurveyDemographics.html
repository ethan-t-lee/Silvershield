<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pre-Survey - Demographics</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f7fb; margin:0; }
    .wrap { max-width: 700px; margin: 40px auto; padding: 0 16px; }
    .card { background:white; border-radius:16px; padding:24px; box-shadow:0 10px 24px rgba(0,0,0,.08); }
    h1 { margin:0 0 8px; font-size:28px; }
    p { margin:0 0 16px; color:#444; }
    label { display:block; font-weight:600; margin-top:18px; margin-bottom:8px; }
    select { width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:16px; }
    button { margin-top:24px; width:100%; padding:14px; border:none; border-radius:12px; font-size:18px; background:#2563eb; color:white; cursor:pointer; }
    .err { color:#b91c1c; font-weight:600; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Quick Pre-Survey</h1>
      <p>Please answer these demographic and background questions before continuing.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="err">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="POST">
        <label>Age</label>
        <select name="age" required>
          <option value="">Select</option>
          <option value="Under 18">Under 18</option>
          <option value="18-24">18-24</option>
          <option value="25-34">25-34</option>
          <option value="35-44">35-44</option>
          <option value="45-54">45-54</option>
          <option value="55-64">55-64</option>
          <option value="65+">65+</option>
        </select>

        <label>Have you ever been scammed (online or by phone)?</label>
        <select name="scammed" required>
          <option value="">Select</option>
          <option value="No">No</option>
          <option value="Yes - attempted">Yes (someone tried)</option>
          <option value="Yes - happened">Yes (it happened)</option>
          <option value="Not sure">Not sure</option>
        </select>

        <label>How good are you with technology?</label>
        <select name="tech_level" required>
          <option value="">Select</option>
          <option value="Beginner">Beginner</option>
          <option value="Okay">Okay</option>
          <option value="Good">Good</option>
          <option value="Very good">Very good</option>
        </select>

        <label>What device do you use most?</label>
        <select name="device" required>
          <option value="">Select</option>
          <option value="Phone">Phone</option>
          <option value="Computer">Computer/Laptop</option>
          <option value="Both">Both</option>
        </select>

        <label>Gender identity</label>
        <select name="gender_identity" required>
          <option value="">Select</option>
          <option value="Woman">Woman</option>
          <option value="Man">Man</option>
          <option value="Non-binary">Non-binary</option>
          <option value="Prefer to self-describe">Prefer to self-describe</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label>Highest education completed</label>
        <select name="education_level" required>
          <option value="">Select</option>
          <option value="Less than high school">Less than high school</option>
          <option value="High school or GED">High school or GED</option>
          <option value="Some college">Some college</option>
          <option value="Associate degree">Associate degree</option>
          <option value="Bachelor degree">Bachelor degree</option>
          <option value="Graduate degree">Graduate degree</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label>Employment status</label>
        <select name="employment_status" required>
          <option value="">Select</option>
          <option value="Employed full-time">Employed full-time</option>
          <option value="Employed part-time">Employed part-time</option>
          <option value="Self-employed">Self-employed</option>
          <option value="Student">Student</option>
          <option value="Retired">Retired</option>
          <option value="Unemployed">Unemployed</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label>Annual household income</label>
        <select name="household_income" required>
          <option value="">Select</option>
          <option value="Under 25k">Under $25,000</option>
          <option value="25k-49k">$25,000-$49,999</option>
          <option value="50k-74k">$50,000-$74,999</option>
          <option value="75k-99k">$75,000-$99,999</option>
          <option value="100k+">$100,000+</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label>Primary language</label>
        <select name="primary_language" required>
          <option value="">Select</option>
          <option value="English">English</option>
          <option value="Spanish">Spanish</option>
          <option value="Chinese">Chinese</option>
          <option value="Other">Other</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label>Country or region</label>
        <select name="country_region" required>
          <option value="">Select</option>
          <option value="United States">United States</option>
          <option value="Canada">Canada</option>
          <option value="Mexico">Mexico</option>
          <option value="Europe">Europe</option>
          <option value="Asia">Asia</option>
          <option value="Other">Other</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label>Have you received cybersecurity training before?</label>
        <select name="prior_cyber_training" required>
          <option value="">Select</option>
          <option value="No">No</option>
          <option value="Yes - once">Yes (once)</option>
          <option value="Yes - multiple times">Yes (multiple times)</option>
          <option value="Not sure">Not sure</option>
        </select>

        <label>How confident do you feel about spotting scams right now?</label>
        <select name="confidence" required>
          <option value="">Select</option>
          <option value="1">1 (Not confident)</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5 (Very confident)</option>
        </select>

        <button type="submit">Continue</button>
      </form>
    </div>
  </div>
</body>
</html>
