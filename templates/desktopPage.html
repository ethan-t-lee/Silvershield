<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ _("Desktop Module") }}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='desktopStyle.css') }}">
</head>

<body>

<!-- Desktop Icons -->
<div class="desktop">
    <div class="icon email"></div>
    <div class="icon internet"></div>
</div>


<!-- Bottom Taskbar -->
<div class="taskbar">
    <div class="taskbar-left">
        <div class="menuIcon"></div>
        <div class="searchIcon"></div>
    </div>

    <div class="taskbar-right">
        <div class="cornerIcon"></div>
    </div>
</div>


<!-- ------------ -->
<!-- Email Window -->
<!-- ------------ -->

<div class="popup" id="emailWindow">

    <div class="popup-header">
        {{ _("Email") }}
        <span class="popup-close">X</span>
    </div>

    <div class="popup-body">

        <!-- AI generated email content -->
        <div id="emailContent" class="email-overlay">
            {{ _("Loading...") }}
        </div>

        <!-- Real/Fake buttons -->
        <div id="emailButtons" class="rf-container" style="display:none;">
            <button id="realBtn" class="rf-btn real">
                {{ _("REAL") }}
            </button>

            <button id="fakeBtn" class="rf-btn fake">
                {{ _("FAKE") }}
            </button>
        </div>

        <div class="email-controls" style="display:flex;gap:8px;align-items:center;margin-top:12px;">
            <button id="readAloudBtn" class="rf-btn">{{ _("Read aloud") }}</button>
        </div>

        <!-- Feedback -->
        <div id="emailFeedback" class="feedback-box" style="display:none;"></div>

    </div>


    <!-- Email notification -->
    <div id="desktopNotificationEmail" class="notification hidden">
        <div id="notificationTitleEmail"></div>
        <div id="notificationMessageEmail"></div>
    </div>

</div>


<!-- --------------- -->
<!-- Internet Window -->
<!-- --------------- -->

<div class="popup" id="internetWindow">

    <div class="popup-header">
        {{ _("Internet") }}
        <span class="popup-close">X</span>
    </div>

    <div class="popup-body">

        <!-- Address Bar -->
        <div class="browser-bar">
            <input
                id="addressBar"
                value="https://search.cyber-training.local/?q=security+alerts"
                readonly>
        </div>

        <!-- AI generated search results -->
        <div id="internetContent" class="internet-content">
            {{ _("Loading...") }}
        </div>


        <!-- Internet Real/Fake Buttons -->
        <div id="internetButtons" class="site-actions" style="display:none;">

            <button id="internetRealBtn" class="rf-btn real">
                {{ _("REAL") }}
            </button>

            <button id="internetFakeBtn" class="rf-btn fake">
                {{ _("FAKE") }}
            </button>

        </div>

        <!-- Feedback -->
        <div id="internetFeedback" class="feedback-box"></div>

    </div>


    <!-- Internet notification -->
    <div id="desktopNotificationInternet" class="notification hidden">
        <div id="notificationTitleInternet"></div>
        <div id="notificationMessageInternet"></div>
    </div>

</div>


<!-- Script Files -->
<script>
globalThis.desktopTranslations = {
    ttsLang: {{ get_locale()|string|tojson }},
    generatingEmail: {{ _("Generating email...")|tojson }},
    errorGeneratingEmail: {{ _("Error generating email.")|tojson }},
    serverError: {{ _("Server error.")|tojson }},
    noEmailLoadedAnalyze: {{ _("No email loaded to analyze.")|tojson }},
    errorAnalyzingResponse: {{ _("Error analyzing response.")|tojson }},
    serverErrorAnalyzingResponse: {{ _("Server error analyzing response.")|tojson }},
    noEmailLoadedRead: {{ _("No email loaded to read.")|tojson }},
    difficulty: {{ _("Difficulty")|tojson }},
    loadingSearchResults: {{ _("Loading search results...")|tojson }},
    errorLoadingSearchResults: {{ _("Error loading search results.")|tojson }},
    loadingWebsite: {{ _("Loading website...")|tojson }},
    errorLoadingWebsite: {{ _("Error loading website.")|tojson }},
    websiteNotLoadedProperly: {{ _("Website not loaded properly.")|tojson }},
    errorAnalyzingWebsite: {{ _("Error analyzing website.")|tojson }},
    serverErrorAnalyzingWebsite: {{ _("Server error analyzing website.")|tojson }},
    correctTitle: {{ _("Correct!")|tojson }},
    incorrectTitle: {{ _("Incorrect")|tojson }}
};
</script>
<script src="{{ url_for('static', filename='tts.js') }}"></script>
<script src="{{ url_for('static', filename='desktopEmail.js') }}"></script>
<script src="{{ url_for('static', filename='desktopInternet.js') }}"></script>
<script src="{{ url_for('static', filename='notification.js') }}"></script>
</body>
</html>
