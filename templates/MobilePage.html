<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ _("Mobile Module") }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobileStyle.css') }}">
     <style>
          .module-back-link {
               display: inline-block;
               margin: 14px auto 8px;
               padding: 10px 14px;
               border-radius: 10px;
               background: #2563eb;
               color: #fff;
               font-weight: 700;
               text-decoration: none;
               border: 1px solid rgba(15, 23, 42, 0.2);
               box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
          }

          .module-back-link:hover {
               background: #1d4ed8;
          }

          .module-back-wrap {
               text-align: center;
          }
     </style>
</head>

<body>

<main>

<div class="module-back-wrap">
     <a class="module-back-link" href="{{ back_to_dashboard_url }}">{{ _("Back to Dashboard") }}</a>
</div>

<div class="phone">

<!-- PHONE HEADER -->

<div class="phone-header">
    <span class="time">3:09</span>
     <span class="camera">O</span>
     <span class="icons">SIG WIFI BAT</span>
</div>


<!-- APP SELECTION SCREEN -->

<div class="apps" id="appMenu">

<h2>{{ _("Select an app:") }}</h2>

<div class="app-buttons">

<button onclick="openApp('email')">

<img src="{{ url_for('static', filename='images/gmailIcon.png') }}"
     alt="{{ _('Gmail') }}">

<span>{{ _("Gmail") }}</span>

</button>


<button onclick="openApp('web')">

<img src="{{ url_for('static', filename='images/internetIcon.png') }}"
     alt="{{ _('Chrome') }}">

<span>{{ _("Chrome") }}</span>

</button>


<button onclick="openApp('call')">

<img src="{{ url_for('static', filename='images/call.png') }}"
     alt="{{ _('Calls') }}">

<span>{{ _("Phone") }}</span>

</button>


<button onclick="openApp('sms')">

<img src="{{ url_for('static', filename='images/message.png') }}"
     alt="{{ _('Messages') }}">

<span>{{ _("Messages") }}</span>

</button>

</div>

</div>


<!-- Scenario content -->

<div id="scenarioBody" class="scenario"></div>

</div>

</main>
<script>
window.mobileLabels = {
     back: {{ _("Back")|tojson }},
     readAloud: {{ _("Read Aloud")|tojson }},
     real: {{ _("REAL")|tojson }},
     fake: {{ _("FAKE")|tojson }},
     speak: {{ _("Speak")|tojson }},
     mute: {{ _("Mute")|tojson }},
     end: {{ _("End")|tojson }},
     speaker: {{ _("Speaker")|tojson }},
     reportScamCall: {{ _("Report Scam Call")|tojson }},
     looksSafe: {{ _("Looks Safe")|tojson }}
};
</script>
<script src="{{ url_for('static', filename='tts.js') }}"></script>
<script src="{{ url_for('static', filename='voiceInput.js') }}"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
