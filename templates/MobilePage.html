<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ _("Mobile Module") }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mobileStyle.css') }}">
</head>

<body>

<main>

<div class="phone">

<!-- PHONE HEADER -->

<div class="phone-header">
    <span class="time">3:09</span>
    <span class="camera">⚫</span>
    <span class="icons">📶 🛜 🔋</span>
</div>


<!-- APP SELECTION SCREEN -->

<div class="apps" id="appMenu">

<h2>{{ _("Select an app:") }}</h2>

<div class="app-buttons">

<button onclick="openApp('email')">

<img src="{{ url_for('static', filename='images/gmailIcon.png') }}"
     alt="{{ _('Email') }}">

<span>{{ _("Email") }}</span>

</button>


<button onclick="openApp('web')">

<img src="{{ url_for('static', filename='images/internetIcon.png') }}"
     alt="{{ _('Web') }}">

<span>{{ _("Web") }}</span>

</button>


<button onclick="openApp('call')">

<img src="{{ url_for('static', filename='images/call.png') }}"
     alt="{{ _('Calls') }}">

<span>{{ _("Phone") }}</span>

</button>


<button onclick="openApp('sms')">

<img src="{{ url_for('static', filename='images/message.png') }}"
     alt="{{ _('Messages') }}">

<span>{{ _("Messages") }}</span>

</button>

</div>

</div>


<!-- Scenario content -->

<div id="scenarioBody" class="scenario"></div>

</div>

</main>
<script>
globalThis.mobileTranslations = {
     ttsLang: {{ get_locale()|string|tojson }},
     loadingScenario: {{ _("Loading scenario...")|tojson }},
     errorLoadingScenario: {{ _("Error loading scenario.")|tojson }},
     level: {{ _("Level")|tojson }},
     back: {{ _("Back")|tojson }},
     loadingEmail: {{ _("Loading email...")|tojson }},
     readAloud: {{ _("Read aloud")|tojson }},
     fake: {{ _("Fake")|tojson }},
     real: {{ _("Real")|tojson }},
     audioCall: {{ _("Audio Call")|tojson }},
     unknownCaller: {{ _("Unknown Caller")|tojson }},
     mute: {{ _("Mute")|tojson }},
     end: {{ _("End")|tojson }},
     speaker: {{ _("Speaker")|tojson }},
     callTranscriptPlaceholder: {{ _("Call transcript will appear here...")|tojson }},
     reportScamCall: {{ _("Report Scam Call")|tojson }},
     looksSafe: {{ _("Looks Safe")|tojson }},
     smsPlaceholder: {{ _("SMS content goes here...")|tojson }},
     chrome: {{ _("Chrome")|tojson }},
     fakeSearchValue: {{ _("how to make money fast")|tojson }},
     googleFooter: {{ _("Google © 2025")|tojson }},
     searchResults: {{ _("Search Results")|tojson }},
     sponsored: {{ _("Sponsored")|tojson }},
     nextPage: {{ _("Next >")|tojson }},
     errorAnalyzingResponse: {{ _("Error analyzing response.")|tojson }},
     currentDifficulty: {{ _("Current difficulty")|tojson }},
     serverErrorAnalyzingChoice: {{ _("Server error analyzing choice.")|tojson }}
};
</script>
<script src="{{ url_for('static', filename='tts.js') }}"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
