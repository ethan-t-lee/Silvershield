<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post-Survey</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f7fb; margin:0; }
    .wrap { max-width: 700px; margin: 40px auto; padding: 0 16px; }
    .card { background:white; border-radius:16px; padding:24px; box-shadow:0 10px 24px rgba(0,0,0,.08); }
    h1 { margin:0 0 8px; font-size:28px; }
    p { margin:0 0 16px; color:#444; }
    label { display:block; font-weight:600; margin-top:18px; margin-bottom:8px; }
    select { width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:16px; }
    button { margin-top:24px; width:100%; padding:14px; border:none; border-radius:12px; font-size:18px; background:#2563eb; color:white; cursor:pointer; }
    .err { color:#b91c1c; font-weight:600; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Post-Survey</h1>
      <p>You've completed the training! Please answer these final questions.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="err">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="POST">
        <label>After participating in our research/education session, how has your familiarity with the term "smishing" changed?</label>
        <select name="post_smishing_familiarity_change" required>
          <option value="">Select</option>
          <option value="No change">No change</option>
          <option value="Slightly more familiar">Slightly more familiar</option>
          <option value="Moderately more familiar">Moderately more familiar</option>
          <option value="Significantly more familiar">Significantly more familiar</option>
          <option value="Extremely familiar">Extremely familiar</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>How has your confidence in identifying potentially harmful messages (smishing, scams) changed after our session?</label>
        <select name="post_confidence_change" required>
          <option value="">Select</option>
          <option value="No change">No change</option>
          <option value="Slightly more confident">Slightly more confident</option>
          <option value="Moderately more confident">Moderately more confident</option>
          <option value="Significantly more confident">Significantly more confident</option>
          <option value="Extremely confident">Extremely confident</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>Do you believe you are now better equipped to recognize a smishing attempt than before the session?</label>
        <select name="post_better_recognition" required>
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>How easy or difficult did you find it to follow the content and instructions provided during the session and while completing this survey?</label>
        <select name="post_content_difficulty" required>
          <option value="">Select</option>
          <option value="Very difficult">Very difficult</option>
          <option value="Difficult">Difficult</option>
          <option value="Neutral">Neutral</option>
          <option value="Easy">Easy</option>
          <option value="Very easy">Very easy</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>Do you feel more aware of the various forms phishing can take (email, phone call, social media) after our session?</label>
        <select name="post_phishing_awareness" required>
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>Post-education, do you plan to use any specific techniques to verify the legitimacy of links or information received through messages?</label>
        <select name="post_verify_plan" required>
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>Are you considering using any security software or apps on your phone because of the information provided during the session?</label>
        <select name="post_security_app_intent" required>
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>Has the session influenced your intentions regarding how often you will update your phone's operating system and apps?</label>
        <select name="post_update_intent" required>
          <option value="">Select</option>
          <option value="More likely">More likely</option>
          <option value="No change">No change</option>
          <option value="Less likely">Less likely</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>Based on the session's information, would you now be more cautious about clicking on links in text messages from unknown numbers?</label>
        <select name="post_unknown_link_caution" required>
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <label>After the session, how has your comfort level with sharing your personal information (address, phone number, etc.) through text messages changed?</label>
        <select name="post_info_sharing_comfort" required>
          <option value="">Select</option>
          <option value="Less comfortable">Less comfortable</option>
          <option value="Slightly less comfortable">Slightly less comfortable</option>
          <option value="No change">No change</option>
          <option value="Slightly more comfortable">Slightly more comfortable</option>
          <option value="Very comfortable">Very comfortable</option>
          <option value="Prefer not to answer">Prefer not to answer</option>
        </select>

        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</body>
</html>
